<!doctype html>
  <html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Демо платформы ICR</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #0f172a;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #f5f8ff;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        border: 1px solid #dbe3ff;
      }
      .row {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      button {
        cursor: pointer;
        padding: 8px 12px;
        border: 1px solid #1f4fd8;
        background: #2563eb;
        color: #fff;
        border-radius: 8px;
      }
      button:disabled {
        opacity: .55;
        cursor: not-allowed;
      }
      .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      textarea {
        width: 100%;
        min-height: 120px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border-bottom: 1px solid #e5e7eb;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      .mono {
        font-family: "Consolas", monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Демо платформы ICR</h1>
      <div class="card">
        <div class="row">
          <label for="apiBase">Базовый URL API</label>
          <input id="apiBase" value="http://localhost:4000/api" />
        </div>
        <div class="row">
          <label for="loginInput">Логин</label>
          <input id="loginInput" value="admin" />
        </div>
        <div class="row">
          <label for="passwordInput">Пароль</label>
          <input id="passwordInput" value="admin123" type="password" />
        </div>
        <div class="btn-row">
          <button id="btnLogin">Войти</button>
          <button id="btnCreateSample" disabled>Создать тестовый поток</button>
          <button id="btnCreateFromScreenshot" disabled>Использовать скриншот из корня</button>
          <button id="btnVerifyAll" disabled>Подтвердить все ячейки</button>
          <button id="btnRefreshCells" disabled>Загрузить ячейки</button>
          <a href="/health">Проверка фронтенда</a>
        </div>
        <p><strong>Токен:</strong> <span id="tokenInfo">не авторизован</span></p>
        <p><strong>Статус:</strong> <span id="status">ожидание</span></p>
      </div>

      <div class="card">
        <h3>Состояние демо</h3>
        <div class="row">
          <label>Идентификатор формы</label>
          <span id="formId">-</span>
        </div>
        <div class="row">
          <label>Идентификатор документа</label>
          <span id="documentId">-</span>
        </div>
        <div class="row">
          <label>Идентификатор задания</label>
          <span id="jobId">-</span>
        </div>
      </div>

      <div class="card">
        <h3>Предпросмотр шаблона</h3>
        <div class="row">
          <label for="templateImageInput">Путь к шаблону</label>
          <input id="templateImageInput" value="screenshot-2019-12-16-at-01-23-20-1-.png" />
        </div>
        <div class="btn-row">
          <button id="btnPreviewTemplateImage">Показать шаблон</button>
          <a id="templateImageLink" target="_blank" rel="noreferrer">Открыть оригинал</a>
        </div>
        <p><span id="templateImageStatus">не задано</span></p>
        <img id="templateImage" alt="предпросмотр шаблона" style="max-width:100%;max-height:280px;border:1px solid #dbe3ff;border-radius:8px;display:none;" />
      </div>

      <div class="card">
        <h3>Распознанные ячейки</h3>
        <table>
          <thead>
            <tr>
              <th>Ячейка</th>
              <th>Модельный символ</th>
              <th>Уверенность</th>
              <th>Альтернативы</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="cellsBody"></tbody>
        </table>
      </div>

      <div class="card">
        <h3>Лог</h3>
        <textarea class="mono" id="log" readonly></textarea>
      </div>
    </div>

    <script>
      const state = {
        token: '',
        formId: null,
        documentId: null,
        jobId: null,
        cells: []
      };

      const $ = (id) => document.getElementById(id);
      const log = (...args) => {
        const line = args.map((item) => (typeof item === 'string' ? item : JSON.stringify(item))).join(' ');
        $('log').value += `${new Date().toLocaleTimeString()} - ${line}\n`;
        $('log').scrollTop = $('log').scrollHeight;
      };
      const status = (txt) => $('status').textContent = txt;

      function apiBase() {
        return $('apiBase').value.replace(/\/$/, '');
      }

      function headers() {
        return state.token ? { Authorization: `Bearer ${state.token}` } : {};
      }

      async function requestJson(path, options = {}) {
        const res = await fetch(`${apiBase()}${path}`, {
          ...options,
          headers: {
            ...headers(),
            ...(options.headers || {})
          }
        });
        const text = await res.text();
        let body = null;
        try {
          body = text ? JSON.parse(text) : null;
        } catch {
          body = text;
        }
        if (!res.ok) {
          throw new Error(body?.message || `${res.status} ${res.statusText}`);
        }
        return body;
      }

      function paintState() {
        $('formId').textContent = state.formId || '-';
        $('documentId').textContent = state.documentId || '-';
        $('jobId').textContent = state.jobId || '-';
      }

      function setBusy(flag) {
        const disabled = !!flag;
        ['btnCreateSample', 'btnCreateFromScreenshot', 'btnVerifyAll', 'btnRefreshCells', 'btnLogin'].forEach((id) => {
          if (id === 'btnLogin' && !disabled) return;
          $(id).disabled = disabled;
        });
      }

      function getTemplateImageUrl(fileName) {
        const base = apiBase().replace(/\/api\/?$/, '');
        const name = (fileName || '').trim();
        const normalizedName = name.startsWith('/')
          ? name
          : `/storage/templates/${name}`;
        return `${base}${normalizedName}`;
      }

      function getTemplateStoragePath(fileName) {
        const name = (fileName || '').trim();
        return name.startsWith('/') ? name : `/storage/templates/${name}`;
      }

      function showTemplateImage(fileName) {
        const url = getTemplateImageUrl(fileName || 'screenshot-2019-12-16-at-01-23-20-1-.png');
        const preview = $('templateImage');
        const link = $('templateImageLink');
        const status = $('templateImageStatus');
        preview.src = '';
        preview.style.display = 'none';
        preview.src = url;
        preview.style.display = 'block';
        link.href = url;
        link.textContent = 'Открыть оригинал';
        status.textContent = `Изображение: ${url}`;
      }

      function candidateSymbols(cell) {
        const candidateValues = cell.candidate_values;
        const candidates = Array.isArray(candidateValues)
          ? candidateValues
          : (typeof candidateValues === 'string'
              ? (() => {
                  try {
                    const parsed = JSON.parse(candidateValues);
                    return Array.isArray(parsed) ? parsed : [];
                  } catch {
                    return [];
                  }
                })()
              : []);
        if (!candidates.length) {
          return [{ symbol: String(cell.recognized_value || '') }];
        }
        return candidates;
      }

      function renderCells() {
        const body = $('cellsBody');
        body.innerHTML = '';
        state.cells.forEach((cell) => {
          const tr = document.createElement('tr');
          const alternatives = candidateSymbols(cell);
          tr.innerHTML = `
            <td>${cell.id}</td>
            <td>${cell.recognized_value || ''}</td>
            <td>${cell.confidence || ''}</td>
            <td>${alternatives
            .map((item, idx) => `<button data-cell="${cell.id}" data-symbol="${item.symbol}" data-index="${idx}">${item.symbol}</button>`)
              .join(' ')}</td>
            <td><input data-cell-input="${cell.id}" placeholder="ручной ввод" /> <button data-verify="${cell.id}">подтвердить</button></td>
          `;
          body.appendChild(tr);
        });
      }

      function attachCellActions() {
        $('cellsBody').addEventListener('click', async (event) => {
          const target = event.target;
          if (!(target instanceof HTMLButtonElement)) return;
          const verifyByCandidate = target.dataset.cell;
          const verifyCellId = target.dataset.verify;
          const cellId = Number(verifyByCandidate || verifyCellId);
          if (!cellId) return;

          let symbol = '';
          if (verifyByCandidate) {
            symbol = target.dataset.symbol || '';
          } else if (verifyCellId) {
            const input = $('cellsBody').querySelector(`input[data-cell-input="${cellId}"]`);
            symbol = input?.value?.trim() || '';
          }
          if (!symbol) return;

          try {
            const updated = await requestJson(`/operator/cells/${cellId}/verify`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ verifiedSymbol: symbol, actionType: 'CORRECTED' })
            });
            log('Ячейка подтверждена', updated);
            await refreshCells();
          } catch (error) {
            log('Ошибка подтверждения ячейки', error.message);
          }
        });
      }

      async function login() {
          status('выполняется вход');
        const login = $('loginInput').value.trim();
        const password = $('passwordInput').value.trim();
        const data = await requestJson('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, password })
        });
        state.token = data.token || '';
        $('tokenInfo').textContent = `${data.user?.login || login} (${state.token.slice(0, 8)}...)`;
        $('btnCreateSample').disabled = false;
        $('btnCreateFromScreenshot').disabled = false;
        $('btnVerifyAll').disabled = true;
        $('btnRefreshCells').disabled = true;
        showTemplateImage($('templateImageInput').value || 'screenshot-2019-12-16-at-01-23-20-1-.png');
        status('выполнен вход');
        log('Успешный вход', data.user);
      }

      async function createSampleFormAndDocument() {
        setBusy(true);
        try {
          status('создание демо-формы');
          const form = await requestJson('/forms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Демо форма',
              version: '1.0',
              description: 'auto-generated for demo',
              fields: [
                {
                  name: 'Фамилия',
                  code: 'surname',
                  dataType: 'text',
                  required: true,
                  cells: [
                    { x: 0, y: 0, width: 100, height: 20, positionX: 1, positionY: 1 },
                    { x: 0, y: 30, width: 100, height: 20, positionX: 2, positionY: 2 }
                  ]
                },
                {
                  name: 'Номер',
                  code: 'docNo',
                  dataType: 'text',
                  required: true,
                  cells: [
                    { x: 0, y: 60, width: 120, height: 20, positionX: 3, positionY: 3 }
                  ]
                }
              ]
            })
          });
          state.formId = form.id;
          log('Форма создана', form);
          paintState();

          status('создание документа');
          const blob = new Blob(['demo-file-content'], { type: 'image/png' });
          const sampleFile = new File([blob], `demo-${Date.now()}.png`, { type: 'image/png' });
          const fd = new FormData();
          fd.append('formId', String(state.formId));
          fd.append('file', sampleFile);
          const docRes = await fetch(`${apiBase()}/documents`, {
            method: 'POST',
            headers: headers(),
            body: fd
          });
          const docText = await docRes.text();
          let doc = null;
          try {
            doc = docText ? JSON.parse(docText) : null;
          } catch {
            throw new Error(`Некорректный ответ загрузки: ${docText || docRes.statusText}`);
          }
          if (!docRes.ok) {
            throw new Error(doc?.message || `${docRes.status} ${docRes.statusText}`);
          }
          state.documentId = doc.id;
          paintState();
          log('Документ загружен', doc);

          status('запуск распознавания');
          const jobRes = await requestJson(`/documents/${state.documentId}/recognize`, {
            method: 'POST'
          });
          state.jobId = jobRes.jobId || jobRes.id || null;
          paintState();
          log('Задание распознавания', jobRes);
          await refreshCells();
          $('btnVerifyAll').disabled = false;
          $('btnRefreshCells').disabled = false;
          status('готово');
        } catch (error) {
          log('Ошибка потока', error.message);
          status('ошибка');
        } finally {
          setBusy(false);
        }
      }

      async function createSampleFromScreenshot() {
        setBusy(true);
        try {
          const screenshotName = $('templateImageInput').value.trim() || 'screenshot-2019-12-16-at-01-23-20-1-.png';
          const imageUrl = getTemplateImageUrl(screenshotName);
          status('создание формы по скриншоту');
          const form = await requestJson('/forms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Шаблон со скриншота',
              version: '1.0',
              description: 'auto-generated for demo',
              template: {
                imagePath: getTemplateStoragePath(screenshotName)
              },
              fields: [
                {
                  name: 'Сведения',
                  code: 'data',
                  dataType: 'text',
                  required: true,
                  cells: [
                    { x: 0, y: 0, width: 120, height: 20, positionX: 1, positionY: 1 },
                    { x: 0, y: 30, width: 120, height: 20, positionX: 2, positionY: 2 },
                    { x: 0, y: 60, width: 120, height: 20, positionX: 3, positionY: 3 }
                  ]
                }
              ]
            })
          });
          state.formId = form.id;
          log('Форма создана', form);
          paintState();

          status('создание документа');
          const screenshotResponse = await fetch(imageUrl);
          if (!screenshotResponse.ok) {
          throw new Error(`Не удалось загрузить скриншот: ${screenshotResponse.status} ${screenshotResponse.statusText}`);
          }
          const screenshotBlob = await screenshotResponse.blob();
          const sampleFile = new File([screenshotBlob], screenshotName, {
            type: screenshotBlob.type || 'image/png'
          });
          const fd = new FormData();
          fd.append('formId', String(state.formId));
          fd.append('file', sampleFile);
          const docRes = await fetch(`${apiBase()}/documents`, {
            method: 'POST',
            headers: headers(),
            body: fd
          });
          const docText = await docRes.text();
          let doc = null;
          try {
            doc = docText ? JSON.parse(docText) : null;
          } catch {
            throw new Error(`Некорректный ответ загрузки: ${docText || docRes.statusText}`);
          }
          if (!docRes.ok) {
            throw new Error(doc?.message || `${docRes.status} ${docRes.statusText}`);
          }
          state.documentId = doc.id;
          paintState();
          log('Документ загружен', doc);

          status('запуск распознавания');
          const jobRes = await requestJson(`/documents/${state.documentId}/recognize`, {
            method: 'POST'
          });
          state.jobId = jobRes.jobId || jobRes.id || null;
          paintState();
          log('Задание распознавания', jobRes);
          await refreshCells();
          $('btnVerifyAll').disabled = false;
          $('btnRefreshCells').disabled = false;
          status('готово');
        } catch (error) {
          log('Ошибка потока скриншота', error.message);
          status('ошибка');
        } finally {
          setBusy(false);
        }
      }

      async function refreshCells() {
        if (!state.jobId) return;
        const jobInfo = await requestJson(`/recognition/jobs/${state.jobId}`, {
          method: 'GET'
        });
        const jobStatus = jobInfo.status || 'UNKNOWN';
        const cells = await requestJson(`/recognition/jobs/${state.jobId}/cells`, {
          method: 'GET'
        });
        state.cells = Array.isArray(cells) ? cells : [];
        renderCells();
        if (!state.cells.length) {
          status(`задание #${jobInfo.id || state.jobId}: ${jobStatus} (нет ячеек)`);
          log(`Нет ячеек для задания #${jobInfo.id || state.jobId}; возможная причина: в форме не настроены ячейки.`);
        } else {
          status(`задание #${jobInfo.id || state.jobId}: ${jobStatus}`);
          log(`Загружено ${state.cells.length} ячеек`);
        }
        paintState();
      }

      async function verifyAll() {
        if (!state.cells.length) {
          await refreshCells();
        }
        const pending = state.cells.filter((item) => item.status === 'NEW' || item.status === 'PENDING');
        for (const cell of pending) {
          const candidates = candidateSymbols(cell);
          const symbol = candidates[0]?.symbol || '';
          if (!symbol) continue;
          await requestJson(`/operator/cells/${cell.id}/verify`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ verifiedSymbol: symbol, actionType: 'CORRECTED' })
          });
        }
        await refreshCells();
        const remaining = state.cells.filter((item) => item.status === 'NEW' || item.status === 'PENDING');
        status(remaining.length ? `в ожидании: ${remaining.length}` : 'все ячейки подтверждены');
      }

      $('btnLogin').addEventListener('click', login);
      $('btnCreateSample').addEventListener('click', createSampleFormAndDocument);
      $('btnCreateFromScreenshot').addEventListener('click', createSampleFromScreenshot);
      $('btnPreviewTemplateImage').addEventListener('click', () => showTemplateImage($('templateImageInput').value));
      $('btnRefreshCells').addEventListener('click', () => refreshCells().catch((e) => log('Ошибка загрузки ячеек', e.message)));
      $('btnVerifyAll').addEventListener('click', () => verifyAll().catch((e) => log('Ошибка подтверждения всех', e.message)));
      attachCellActions();
    </script>
  </body>
</html>
